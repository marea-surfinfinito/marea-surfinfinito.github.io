<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07110f"><title>Wolf Story · Rain Interactive</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#050807;color:#d8eee7;font-family:system-ui,sans-serif;overflow:hidden}#game{display:block;width:100vw;height:100vh;touch-action:manipulation;background:#102a2b}#wolfArt{position:fixed;z-index:3;left:17%;bottom:17%;width:min(34vw,430px);height:auto;object-fit:contain;pointer-events:none;filter:brightness(.18) contrast(1.7) drop-shadow(0 12px 10px #0008);transform-origin:50% 100%;animation:wolfWalk .72s ease-in-out infinite alternate}@keyframes wolfWalk{from{transform:translateY(0) rotate(-.4deg)}to{transform:translateY(-5px) rotate(.5deg)}}@media(max-width:600px){#wolfArt{left:8%;bottom:20%;width:48vw}} .ui{position:fixed;inset:0;pointer-events:none}.brand{position:absolute;left:18px;top:16px;font:700 10px monospace;letter-spacing:.22em;color:#b6e8d9aa}.hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);font:700 10px monospace;letter-spacing:.16em;color:#eafff0aa;white-space:nowrap;transition:opacity .8s}.back{pointer-events:auto;position:absolute;right:16px;top:14px;width:44px;height:44px;border:1px solid #80bbaa77;background:#05100dcc;color:#b8eadb;font-size:20px;border-radius:50%;cursor:pointer}.distance{position:absolute;right:18px;bottom:18px;font:700 10px monospace;letter-spacing:.15em;color:#b6e8d999}@media(prefers-reduced-motion:reduce){.hint{transition:none}#wolfArt{animation:none}}</style></head>
<body><canvas id="game" aria-label="Wolf Story, bosque infinito lluvioso"></canvas><img id="wolfArt" src="/rain-interactive/assets/wolf-lobo.webp" alt="Lobo negro caminando"><div class="ui"><div class="brand">WOLF STORY // RAIN INTERACTIVE</div><button class="back" id="back" aria-label="Volver a Rain">×</button><div class="hint" id="hint">TOCA · CLIC · ESPACIO PARA SALTAR</div><div class="distance" id="distance">0000 m</div></div>
<script>
const c=document.querySelector('#game'),x=c.getContext('2d'),hint=document.querySelector('#hint'),dist=document.querySelector('#distance');let W=0,H=0,dpr=1,t=0,world=0,last=0,jump=0,vy=0,running=true;const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const rnd=n=>{const q=Math.sin(n*127.1+311.7)*43758.5453;return q-Math.floor(q)};
function mountain(base,amp,step,speed,col){x.fillStyle=col;x.beginPath();x.moveTo(0,H);for(let sx=-step;sx<=W+step;sx+=step){let wx=(sx+world*speed)/step;let y=base-rnd(Math.floor(wx))*amp;x.lineTo(sx,y)}x.lineTo(W,H);x.closePath();x.fill()}
function trees(speed,base,scale,col,seed){x.fillStyle=col;const spacing=70*scale,off=-(world*speed%spacing);for(let i=-2;i<W/spacing+3;i++){let px=off+i*spacing,n=Math.floor((world*speed)/spacing)+i;let h=(90+rnd(n+seed)*120)*scale;let y=base;x.fillRect(px-4*scale,y-h*.48,8*scale,h*.48);for(let k=0;k<4;k++){x.beginPath();x.moveTo(px,y-h);x.lineTo(px-30*scale-k*5,y-h*.35+k*16*scale);x.lineTo(px+30*scale+k*5,y-h*.35+k*16*scale);x.closePath();x.fill()}}}
function ground(){let g=x.createLinearGradient(0,H*.72,0,H);g.addColorStop(0,'#183a2d');g.addColorStop(1,'#07110e');x.fillStyle=g;x.fillRect(0,H*.73,W,H*.27);x.strokeStyle='#7fd6c533';x.lineWidth=2;for(let i=0;i<10;i++){let px=((i*173-world*.9)%(W+220)+W+220)%(W+220)-110;x.beginPath();x.ellipse(px,H*.82+(i%3)*20,45+(i%4)*18,4,0,0,Math.PI*2);x.stroke()}}
function wolf(){return;const gx=Math.max(95,W*.22),gy=H*.73-22-jump,phase=t*.012; x.save();x.translate(gx,gy);let bob=Math.sin(phase*2)*2;x.translate(0,bob);x.fillStyle='#06090a';x.strokeStyle='#182426';x.lineWidth=2;x.beginPath();x.ellipse(0,-23,45,22,-.08,0,Math.PI*2);x.fill();x.stroke();x.beginPath();x.ellipse(38,-31,21,17,-.15,0,Math.PI*2);x.fill();x.beginPath();x.moveTo(43,-45);x.lineTo(49,-65);x.lineTo(55,-44);x.closePath();x.fill();x.beginPath();x.moveTo(27,-44);x.lineTo(31,-61);x.lineTo(39,-43);x.closePath();x.fill();x.beginPath();x.moveTo(-42,-29);x.quadraticCurveTo(-75,-45,-88,-27);x.quadraticCurveTo(-66,-31,-43,-15);x.fill();let stride=Math.sin(phase)*18;for(const [ox,s] of [[-23,1],[-6,-1],[19,-1],[32,1]]){x.lineWidth=9;x.lineCap='round';x.strokeStyle='#070a0b';x.beginPath();x.moveTo(ox,-13);x.lineTo(ox+s*stride*.35,10);x.lineTo(ox+s*stride*.62,28);x.stroke()}x.fillStyle='#9fe6c8';x.beginPath();x.arc(47,-34,2.2,0,7);x.fill();x.restore()}
function rain(){x.strokeStyle='#d9fff53b';x.lineWidth=1;let count=reduce?30:Math.min(170,Math.floor(W/7));for(let i=0;i<count;i++){let rx=(i*83+(t*.34))%(W+100)-50,ry=(i*137+t*.72)%(H+100)-50;x.beginPath();x.moveTo(rx,ry);x.lineTo(rx-7,ry+18);x.stroke()}}
function draw(ts){if(!running)return;let dt=Math.min(32,ts-last||16);last=ts;t+=dt;world+=dt*.085;let sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#aeb7b8');sky.addColorStop(.42,'#688c8b');sky.addColorStop(1,'#173432');x.fillStyle=sky;x.fillRect(0,0,W,H);mountain(H*.51,H*.25,170,.045,'#668584');mountain(H*.59,H*.20,125,.09,'#416d69');trees(.16,H*.74,.72,'#315a53',2);trees(.32,H*.76,1,'#173d36',20);ground();trees(.68,H*.79,1.3,'#09231e',50);rain();if(jump>0||vy!==0){vy-=dt*.0022;jump+=vy*dt;if(jump<=0){jump=0;vy=0}}dist.textContent=String(Math.floor(world/18)).padStart(4,'0')+' m';requestAnimationFrame(draw)}
function leap(){if(jump===0){vy=.72;hint.style.opacity='0'}}addEventListener('pointerdown',e=>{if(e.target.id!=='back')leap()});addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();leap()}});document.querySelector('#back').addEventListener('click',()=>location.href='/');requestAnimationFrame(draw);
</script></body></html>
