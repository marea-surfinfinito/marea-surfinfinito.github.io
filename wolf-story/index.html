<!doctype html>
<html lang="es"><head>
<meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07110f"><title>Wolf Story · Rain Interactive</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#040807}canvas{display:block;width:100vw;height:100vh}
.back{position:fixed;z-index:8;right:14px;top:14px;width:42px;height:42px;border-radius:50%;border:1px solid #75cdb777;background:#06110ecc;color:#b8eadb;font-size:20px}
@media(prefers-reduced-motion:reduce){canvas{opacity:.96}}
</style></head><body><canvas id="scene" aria-label="Wolf Story: un lobo negro camina bajo una tormenta"></canvas><button class="back" id="back" aria-label="Volver">×</button>
<script>
const c=document.querySelector('#scene'),g=c.getContext('2d');let W,H,D=1,T=0,last=0,world=0;const TAU=Math.PI*2,reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const hash=n=>{let s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function ridge(base,amp,step,speed,col){g.fillStyle=col;g.beginPath();g.moveTo(0,H);let off=world*speed;for(let sx=-step;sx<W+step;sx+=step){let n=Math.floor((sx+off)/step),f=((sx+off)%step+step)%step/step;let y=base-(hash(n)*.72+hash(n+1)*.28)*amp;g.lineTo(sx,y)}g.lineTo(W,H);g.fill()}
function forest(speed,base,scale,col,seed){g.fillStyle=col;let sp=55*scale,off=-((world*speed)%sp);for(let i=-2;i<W/sp+3;i++){let n=Math.floor(world*speed/sp)+i,px=off+i*sp,h=(75+hash(n+seed)*120)*scale;g.fillRect(px-2*scale,base-h*.45,4*scale,h*.45);for(let k=0;k<5;k++){let yy=base-h+k*h*.13,w=(18+k*5)*scale;g.beginPath();g.moveTo(px,yy);g.lineTo(px-w,yy+h*.24);g.lineTo(px+w,yy+h*.24);g.fill()}}}
function plants(speed,base,seed){let sp=48,off=-((world*speed)%sp);for(let i=-2;i<W/sp+3;i++){let n=Math.floor(world*speed/sp)+i,px=off+i*sp,h=18+hash(n+seed)*44;g.strokeStyle=n%7===0?'#b92f69':'#1b7468';g.lineWidth=2;g.beginPath();g.moveTo(px,base);g.quadraticCurveTo(px-8,base-h*.55,px+(hash(n)*12-6),base-h);g.stroke();for(let j=1;j<4;j++){let yy=base-h*j/4;g.beginPath();g.moveTo(px,yy);g.lineTo(px+(j%2?12:-12),yy-8);g.stroke()}}}
function terrain(){let y=H*.76;let grad=g.createLinearGradient(0,y,0,H);grad.addColorStop(0,'#142d27');grad.addColorStop(1,'#030706');g.fillStyle=grad;g.fillRect(0,y,W,H-y);g.strokeStyle='#86d9ca38';g.lineWidth=1.5;for(let i=0;i<12;i++){let px=((i*181-world*.95)%(W+220)+W+220)%(W+220)-110;g.beginPath();g.ellipse(px,y+45+(i%4)*22,40+(i%3)*20,4,0,0,TAU);g.stroke()}plants(.92,y+18,41)}
function moon(){let mx=W*.70,my=H*.17,r=Math.min(W,H)*.055;let q=g.createRadialGradient(mx,my,0,mx,my,r*2.4);q.addColorStop(0,'#dffff5');q.addColorStop(.22,'#55e0c4');q.addColorStop(.55,'#1a8e80aa');q.addColorStop(1,'#1a8e8000');g.fillStyle=q;g.beginPath();g.arc(mx,my,r*2.4,0,TAU);g.fill();g.strokeStyle='#d8fff1';g.lineWidth=3;g.beginPath();g.arc(mx,my,r,0,TAU);g.stroke();g.strokeStyle='#5ce1c4aa';for(let k=0;k<3;k++){g.beginPath();g.arc(mx,my,r*(.62+k*.15),k*.9,TAU-k*.5);g.stroke()}}
function wolf(){let x=W<650?W*.31:W*.28,y=H*.755,sc=Math.max(.7,Math.min(1.25,W/1100)),p=(T*.00155)%1,a=p*TAU,bob=Math.sin(a*2)*2*sc;g.save();g.translate(x,y+bob);g.scale(sc,sc);g.fillStyle='#050707';g.strokeStyle='#223c38';g.lineWidth=1.4;
g.beginPath();g.ellipse(0,-46,76,34,-.05,0,TAU);g.fill();g.stroke();g.beginPath();g.ellipse(68,-55,34,25,-.12,0,TAU);g.fill();g.beginPath();g.moveTo(89,-58);g.lineTo(117,-52);g.lineTo(91,-42);g.closePath();g.fill();
g.beginPath();g.moveTo(51,-73);g.lineTo(58,-100);g.lineTo(70,-72);g.fill();g.beginPath();g.moveTo(70,-74);g.lineTo(80,-98);g.lineTo(88,-68);g.fill();
g.beginPath();g.moveTo(-70,-51);g.quadraticCurveTo(-116,-72,-137,-47);g.quadraticCurveTo(-108,-55,-72,-29);g.fill();
const legs=[[-45,0],[-16,Math.PI],[30,Math.PI],[54,0]];for(const [ox,ph] of legs){let s=Math.sin(a+ph),hipY=-26,kx=ox+s*16,ky=4+Math.abs(s)*7,fx=ox+s*29,fy=35-Math.max(0,-s)*5;g.strokeStyle='#050707';g.lineWidth=13;g.lineCap='round';g.beginPath();g.moveTo(ox,hipY);g.lineTo(kx,ky);g.lineTo(fx,fy);g.stroke();g.lineWidth=7;g.beginPath();g.moveTo(fx,fy);g.lineTo(fx+13,fy);g.stroke()}
g.strokeStyle='#9ae8d522';g.lineWidth=1;for(let i=0;i<32;i++){let xx=-65+hash(i)*145,yy=-70+hash(i+40)*48;g.beginPath();g.moveTo(xx,yy);g.lineTo(xx+8+hash(i+80)*12,yy+4);g.stroke()}g.restore()}
function rain(){let count=reduce?45:Math.min(260,Math.floor(W/5));for(let i=0;i<count;i++){let rx=(i*79+T*.32)%(W+160)-80,ry=(i*131+T*.78)%(H+100)-50;g.strokeStyle=i%8===0?'#d9fff577':'#d9fff538';g.lineWidth=i%8===0?1.5:1;g.beginPath();g.moveTo(rx,ry);g.lineTo(rx-9,ry+24);g.stroke()}}
function lightning(){let pulse=Math.max(0,Math.sin(T*.00019*TAU)-.985)*8;if(pulse){g.fillStyle='rgba(184,255,239,'+Math.min(.12,pulse*.03)+')';g.fillRect(0,0,W,H)}}
function frame(ts){let dt=Math.min(32,ts-last||16);last=ts;T+=dt;if(!reduce)world+=dt*.055;let sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#071c21');sky.addColorStop(.45,'#17605d');sky.addColorStop(1,'#09201c');g.fillStyle=sky;g.fillRect(0,0,W,H);ridge(H*.49,H*.28,180,.055,'#315d61');ridge(H*.59,H*.22,130,.11,'#1d4848');forest(.16,H*.75,.72,'#244e48',2);moon();forest(.32,H*.77,1,'#123b34',20);terrain();forest(.65,H*.79,1.18,'#071f1a',50);wolf();rain();lightning();requestAnimationFrame(frame)}requestAnimationFrame(frame);
document.querySelector('#back').addEventListener('click',()=>location.href='/');
</script><style id="rain-lang-style">#rain-lang{position:fixed;top:14px;right:14px;z-index:99999;background:rgba(0,0,0,.78);border:1px solid #444;padding:5px 8px;font:11px Arial,sans-serif}#rain-lang button{border:0;background:transparent;color:#aaa;padding:5px;cursor:pointer}#rain-lang button.active{color:#fff;text-decoration:underline}#google_translate_element{position:fixed;left:-9999px;top:-9999px}body{top:0!important}</style><div id="rain-lang"><button data-lang="es">ES</button>/<button data-lang="en">EN</button></div><div id="google_translate_element"></div><script id="rain-lang-js">(function(){const K="rain-site-lang";function a(l){localStorage.setItem(K,l);document.documentElement.lang=l;document.querySelectorAll("#rain-lang button").forEach(b=>b.classList.toggle("active",b.dataset.lang===l));const g=()=>{const s=document.querySelector(".goog-te-combo");if(!s)return false;s.value=l==="es"?"":l;s.dispatchEvent(new Event("change",{bubbles:true}));return true};if(!g()){let n=0,t=setInterval(()=>{if(g()||++n>40)clearInterval(t)},250)}}window.googleTranslateElementInit=()=>{new google.translate.TranslateElement({pageLanguage:"es",includedLanguages:"es,en",autoDisplay:false},"google_translate_element");setTimeout(()=>a(localStorage.getItem(K)||"es"),300)};document.querySelectorAll("#rain-lang button").forEach(b=>b.onclick=()=>a(b.dataset.lang));})();</script><script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script></body></html>
