<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Imaginary Girl</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:10px}
.stage{position:relative;width:100%;background:#000}
.stage img{display:block;width:100%;height:auto}
.hotspot{position:absolute;background:transparent;border:0;cursor:pointer;touch-action:manipulation}
.hotspot:focus-visible{outline:2px solid #ff5fc8;outline-offset:2px}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:#000c;z-index:20}
.modal.open{display:flex}
.card{width:min(520px,100%);max-height:80vh;overflow:auto;background:#111;border:2px solid #ff5fc8;padding:18px;box-shadow:0 0 25px #ff5fc866}
.card h2{margin-top:0;color:#ff8fda}
.close{float:right;background:#ff5fc8;color:#111;border:0;padding:10px 14px;font-weight:bold}
.msg{border-top:1px dashed #82456f;padding:9px 0}
.reply{color:#ff9edc}
.mail{color:#ff9edc}
small{color:#aaa}
@media(max-width:600px){.wrap{padding:0}.card{border-radius:0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stage">
    <img src="https://raw.githubusercontent.com/rain-interactive/imaginary-girl/main/ChatGPT%20Image%2029%20sept%202026%2C%2020_29_20.png" alt="Imaginary Girl homepage">
    <button class="hotspot" style="left:2%;top:18%;width:17%;height:4%" data-view="home" aria-label="Home"></button>
    <button class="hotspot" style="left:2%;top:23%;width:17%;height:4%" data-view="diary" aria-label="Diary"></button>
    <button class="hotspot" style="left:2%;top:28%;width:17%;height:4%" data-view="photos" aria-label="Photos"></button>
    <button class="hotspot" style="left:2%;top:33%;width:17%;height:4%" data-view="videos" aria-label="Videos"></button>
    <button class="hotspot" style="left:2%;top:38%;width:17%;height:4%" data-view="guestbook" aria-label="Guestbook"></button>
    <button class="hotspot" style="left:2%;top:43%;width:17%;height:4%" data-view="about" aria-label="About"></button>
    <button class="hotspot" style="left:2%;top:48%;width:17%;height:4%" data-view="contact" aria-label="Contact"></button>
    <button class="hotspot" style="left:66%;top:15%;width:31%;height:12%" data-view="music" aria-label="Music player"></button>
    <button class="hotspot" style="left:22%;top:56%;width:46%;height:30%" data-view="guestbook" aria-label="Guestbook area"></button>
  </div>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="title">
  <div class="card">
    <button class="close" id="close">X</button>
    <h2 id="title"></h2>
    <div id="body"></div>
  </div>
</div>
<script>
const modal=document.getElementById('modal');
const title=document.getElementById('title');
const body=document.getElementById('body');
const views={
home:['HOME','Punky_Choni online. Welcome to Imaginary Girl.'],
diary:['DIARY','<p><b>29/09</b> — Metallica demasiado alto. Chicle rosa. No me rayes.</p><p><b>28/09</b> — Britney otra vez. Sí, ¿y qué?</p><p><b>27/09</b> — Hoy paso de todo el mundo.</p>'],
photos:['PHOTOS','<p>Álbum personal de Punky_Choni.</p><p><small>Las fotos se irán añadiendo aquí.</small></p>'],
videos:['VIDEOS','<p>Clips, webcam y basura digital de 2005.</p>'],
guestbook:['GUESTBOOK','<div class="msg"><b>xX_darkboy_Xx:</b> eres perfecta ♥</div><div class="msg reply"><b>Punky_Choni:</b> ya lo sé. siguiente.</div><div class="msg"><b>anonymous69:</b> estás sola esta noche?</div><div class="msg reply"><b>Punky_Choni:</b> qué pesados sois.</div><div class="msg"><b>cam_freak:</b> enciende la webcam!!!</div><div class="msg reply"><b>Punky_Choni:</b> págate una vida.</div>'],
about:['ABOUT','<p>Morena, punky-choni, adicta al chicle rosa, Metallica, Britney Spears y al estampado de leopardo.</p><p>Fuma, lleva piercings en la nariz y ombligo y responde mal porque le da la gana.</p>'],
contact:['CONTACT','<p class="mail">Punky_Choni@hotmail.com</p>'],
music:['NOW PLAYING','<p>METALLICA</p><p>Britney Spears</p><p><small>reproductor visual estilo 2000</small></p>']
};
document.querySelectorAll('.hotspot').forEach(btn=>btn.addEventListener('click',()=>{
  const v=views[btn.dataset.view];
  title.textContent=v[0]; body.innerHTML=v[1]; modal.classList.add('open');
}));
document.getElementById('close').addEventListener('click',()=>modal.classList.remove('open'));
modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('open')});
</script>
</body>
</html>
