<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Imaginary Girl · Desarrollo privado</title>
<style>
html,body{margin:0;min-height:100%;background:#080507;color:#ffd7eb;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:24px}
main{width:min(560px,100%);text-align:center;border:1px solid #7b3159;background:#150b11;padding:42px 28px;box-shadow:0 0 40px #000}
.eyebrow{color:#ff66b3;font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
h1{margin:16px 0 12px;color:#ff8dc8;font-size:clamp(34px,8vw,62px);letter-spacing:-.05em}
p{margin:0;color:#b895a6;line-height:1.55}
a{display:inline-block;margin-top:28px;color:#ff66b3;text-decoration:none;border:1px solid #7b3159;padding:11px 15px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
</style>
</head>
<body>
<main>
<div class="eyebrow">Rain Interactive · Proyecto 08</div>
<h1>Imaginary Girl 😈</h1>
<p>En desarrollo · Acceso privado</p>
<a href="/">Volver a Rain Interactive</a>
</main>
<style id="rain-lang-style">#rain-lang{position:fixed;top:14px;right:14px;z-index:99999;background:rgba(0,0,0,.78);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.22);padding:5px 8px;font:11px Arial,sans-serif;letter-spacing:.08em}#rain-lang button{appearance:none;border:0;background:transparent;color:#aaa;padding:5px;cursor:pointer}#rain-lang button.active{color:#fff;text-decoration:underline;text-underline-offset:3px}#google_translate_element{position:fixed;left:-9999px;top:-9999px}.goog-te-banner-frame.skiptranslate{display:none!important}body{top:0!important}</style><div id="rain-lang"><button data-lang="es">ES</button><span>/</span><button data-lang="en">EN</button></div><div id="google_translate_element" aria-hidden="true"></div><script id="rain-lang-js">(function(){const K="rain-site-lang";function mark(l){document.querySelectorAll("#rain-lang button").forEach(b=>b.classList.toggle("active",b.dataset.lang===l));document.documentElement.lang=l}function apply(l){localStorage.setItem(K,l);mark(l);const go=()=>{const s=document.querySelector(".goog-te-combo");if(!s)return false;s.value=l==="es"?"":l;s.dispatchEvent(new Event("change",{bubbles:true}));return true};if(!go()){let n=0,t=setInterval(()=>{if(go()||++n>40)clearInterval(t)},250)}}window.googleTranslateElementInit=function(){new google.translate.TranslateElement({pageLanguage:"es",includedLanguages:"es,en",autoDisplay:false},"google_translate_element");setTimeout(()=>apply(localStorage.getItem(K)||"es"),300)};document.querySelectorAll("#rain-lang button").forEach(b=>b.onclick=()=>apply(b.dataset.lang));mark(localStorage.getItem(K)||"es")})();</script><script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script></body>
</html>
