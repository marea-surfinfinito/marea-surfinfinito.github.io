<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Seis Caminos — Filosofía, estrategia y disciplina</title>
<meta name="description" content="Portal de filosofía, estrategia y disciplina del Oriente clásico: Tao Te Ching, El arte de la guerra, Hagakure, Bushidō, Shōninki y Bansenshūkai.">
<style>
:root{
  --bg:#080808; --paper:#d8d2c6; --muted:#8b877e; --line:#2b2a27;
  --ink:#111; --accent:#a9976f; --panel:#0e0e0d; --soft:#161614;
  --max:1240px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:
  radial-gradient(circle at 50% -20%,#1b1a16 0,#0b0b0a 35%,#080808 68%),
  var(--bg);
  color:var(--paper);
  font-family:ui-serif,Georgia,Cambria,"Times New Roman",serif;
  min-height:100vh;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;
  background-image:
  linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,.014) 1px,transparent 1px);
  background-size:36px 36px;
  mask-image:linear-gradient(to bottom,black,transparent 80%);
}
a{color:inherit}
button{font:inherit}
.wrap{width:min(calc(100% - 34px),var(--max));margin:auto}
.hero{
  min-height:92svh;display:flex;align-items:flex-end;text-align:left;padding:0;
  border-bottom:1px solid var(--line);position:relative;isolation:isolate;overflow:hidden;
  background:#050505
}
.hero:before{
  content:"";position:absolute;inset:0;z-index:-3;
  background:
    radial-gradient(circle at 50% 18%,rgba(169,151,111,.10) 0%,rgba(169,151,111,.04) 18%,transparent 42%),
    linear-gradient(180deg,#11110f 0%,#090909 42%,#060606 100%)
}
.hero:after{
  content:"";position:absolute;inset:0;z-index:-2;
  background:
    linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px),
    linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px);
  background-size:36px 36px;
  opacity:.22
}
.hero .wrap{position:relative;padding:70px 0 9vh}
.hero-copy{max-width:880px;border-left:1px solid rgba(216,210,198,.42);padding-left:24px}
.kicker{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.32em;text-transform:uppercase;font-size:11px;color:#b2aa9d;
  text-shadow:0 2px 14px rgba(0,0,0,.8)
}
h1{font-size:clamp(52px,10vw,126px);font-weight:400;letter-spacing:.055em;margin:16px 0 10px;line-height:.92;text-shadow:0 3px 24px rgba(0,0,0,.78)}
.hero p{max-width:690px;margin:0;color:#c6beb1;font-size:clamp(16px,2vw,21px);line-height:1.62;text-shadow:0 2px 16px rgba(0,0,0,.9)}
.scroll{margin-top:34px;font:11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.22em;color:#9c958a;text-transform:uppercase}
.hero-credit{position:absolute;right:0;bottom:20px;font:10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;color:#817a70;text-transform:uppercase;text-align:right}
.section{padding:82px 0;border-bottom:1px solid var(--line)}
.compact-paths{padding-top:56px;padding-bottom:58px}
.section-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:32px}
.section h2{font-weight:400;font-size:clamp(28px,4.5vw,52px);margin:0;letter-spacing:.03em}
.section-intro{max-width:620px;color:#8f8b82;line-height:1.65;margin:0}
.gates{
  display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
  background:var(--line);border:1px solid var(--line)
}
.gate{
  min-height:390px;border:0;color:var(--paper);padding:20px 18px 18px;text-align:left;
  cursor:pointer;position:relative;transition:.25s ease;overflow:hidden;background:#0a0a09;
  display:flex;flex-direction:column;align-items:center
}
.gate:hover,.gate:focus-visible{outline:none;background:#0f0f0d}
.gate .num{
  width:100%;font:9px ui-monospace,SFMono-Regular,Menlo,monospace;
  color:#656159;letter-spacing:.18em;text-transform:uppercase;margin-bottom:10px
}
.book{
  width:min(60%,170px);aspect-ratio:.72/1;position:relative;margin:8px auto 10px;
  box-shadow:0 18px 45px rgba(0,0,0,.38),0 0 0 1px rgba(255,255,255,.06);
  overflow:hidden;transform:translateY(0);transition:transform .28s ease,box-shadow .28s ease;
  flex:0 0 auto
}
.gate:hover .book,.gate:focus-visible .book{
  transform:translateY(-5px);
  box-shadow:0 24px 58px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.09)
}
.book:after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(90deg,rgba(255,255,255,.035),transparent 12%,transparent 88%,rgba(0,0,0,.09)),
    linear-gradient(180deg,rgba(255,255,255,.025),transparent 18%,transparent 82%,rgba(0,0,0,.10));
  mix-blend-mode:screen;opacity:.45
}
.book .vertical{
  writing-mode:vertical-rl;text-orientation:mixed;letter-spacing:.14em
}
.book .binding{
  position:absolute;right:10px;top:0;bottom:0;width:15px;
  border-left:1px solid rgba(0,0,0,.35)
}
.book .binding:before{
  content:"";position:absolute;left:3px;top:8%;bottom:8%;width:8px;
  background:repeating-linear-gradient(to bottom,transparent 0 28px,rgba(30,24,17,.68) 28px 31px,transparent 31px 56px)
}
.cover-tao{
  background:#213147;
  background-image:linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:5px 100%
}
.cover-tao .slip{
  position:absolute;left:18px;top:18px;bottom:18px;width:52px;background:#d8cfb3;
  color:#151515;border:1px solid rgba(0,0,0,.38);display:flex;align-items:center;
  justify-content:flex-start;padding-top:14px;font-size:23px;line-height:1
}
.cover-tao .mini{
  position:absolute;left:35px;bottom:30px;color:#1d1d1c;font-size:11px;z-index:2
}

.cover-sunzi{
  background:#26211b
}
.cover-sunzi .pattern{
  position:absolute;right:0;top:0;bottom:0;width:34%;
  background:
    radial-gradient(circle at 8px 8px,transparent 0 4px,rgba(83,67,42,.28) 4.5px 5.5px,transparent 6px),
    #c5b79a;
  background-size:16px 16px
}
.cover-sunzi .slip{
  position:absolute;left:30%;top:13%;bottom:13%;width:58px;background:#c7aa7b;
  color:#181512;border:1px solid #6f5c3d;display:flex;align-items:center;
  justify-content:flex-start;padding-top:22px;font-size:25px
}
.cover-sunzi .seal{
  position:absolute;left:calc(30% + 10px);top:17%;width:34px;height:34px;
  border:2px solid #8d2e27;color:#8d2e27;display:grid;place-items:center;font-size:18px
}
.cover-sunzi .binding{left:8px;right:auto;border-left:0;border-right:1px solid rgba(0,0,0,.45)}
.cover-sunzi .binding:before{left:auto;right:3px}

.cover-hagakure{
  background:#8d9b92;
  background-image:linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:7px 100%
}
.cover-hagakure .slip{
  position:absolute;left:20px;top:18px;bottom:18px;width:48px;background:#ded6bd;
  color:#25231f;border:1px solid rgba(0,0,0,.24);display:flex;align-items:center;
  justify-content:flex-start;padding-top:16px;font-size:24px
}
.cover-hagakure .vol{
  position:absolute;left:37px;bottom:28px;color:#514a40;font-size:10px;writing-mode:vertical-rl
}

.cover-bushido{
  background:#506f68;color:#d7b56d
}
.cover-bushido .gold-rule{
  position:absolute;left:13%;right:13%;top:11%;height:1px;background:#b99455
}
.cover-bushido .latin-title{
  position:absolute;left:0;right:0;top:35%;text-align:center;
  font-family:Georgia,"Times New Roman",serif;font-size:26px;letter-spacing:.12em
}
.cover-bushido .latin-sub{
  position:absolute;left:18%;right:18%;top:49%;text-align:center;
  font-family:Georgia,"Times New Roman",serif;font-size:10px;line-height:1.35;letter-spacing:.11em
}
.cover-bushido .red-sun{
  position:absolute;width:82px;height:41px;border-radius:82px 82px 0 0;
  background:#a9342e;left:50%;bottom:0;transform:translateX(-50%)
}
.cover-bushido .branch{
  position:absolute;left:15%;top:19%;width:90px;height:1px;background:#a9342e;transform:rotate(-13deg)
}
.cover-bushido .branch:before,.cover-bushido .branch:after{
  content:"";position:absolute;width:18px;height:8px;border:1px solid #a9342e;border-radius:50%
}
.cover-bushido .branch:before{left:17px;top:-8px;transform:rotate(-28deg)}
.cover-bushido .branch:after{left:54px;top:2px;transform:rotate(24deg)}

.cover-shoninki{
  background:
    radial-gradient(circle at 20% 18%,rgba(68,45,22,.10) 0 1px,transparent 2px),
    radial-gradient(circle at 72% 61%,rgba(68,45,22,.08) 0 1px,transparent 2px),
    #b79a6b;
  background-size:43px 43px,61px 61px,auto
}
.cover-shoninki .brush{
  position:absolute;left:28px;top:22px;color:#171512;font-size:31px;
  writing-mode:vertical-rl;letter-spacing:.16em;font-weight:600
}
.cover-shoninki .small-kanji{
  position:absolute;left:34px;bottom:26px;color:#171512;font-size:17px
}

.cover-bansenshukai{
  background:
    repeating-linear-gradient(0deg,rgba(61,37,15,.10) 0 1px,transparent 1px 9px),
    #a87846
}
.cover-bansenshukai .brush{
  position:absolute;left:50%;top:16%;transform:translateX(-50%);
  color:#16120e;font-size:34px;writing-mode:vertical-rl;letter-spacing:.12em;font-weight:700
}
.cover-bansenshukai .cord{
  position:absolute;background:#3a2417;opacity:.9
}
.cover-bansenshukai .c1{left:0;right:0;top:29%;height:5px}
.cover-bansenshukai .c2{top:0;bottom:0;left:52%;width:5px;transform:rotate(-7deg);transform-origin:center}
.cover-bansenshukai .knot{
  position:absolute;left:46%;top:26%;width:28px;height:22px;border:4px solid #3a2417;
  border-radius:50%;transform:rotate(-18deg)
}

.gate-caption{width:100%;padding-top:12px}
.gate-caption .original{
  display:block;color:#8e897f;font:10px ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px
}
.gate h3{
  font-size:clamp(20px,2vw,27px);font-weight:400;line-height:1.05;
  margin:0 0 6px;max-width:15ch;text-shadow:none
}
.gate p{
  font-size:12px;color:#77736c;margin:0;line-height:1.45;max-width:32ch;text-shadow:none
}
.gate:after{
  content:"Abrir";align-self:flex-start;margin-top:10px;color:#6f6a61;
  font:10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase
}
.viewer{
  margin-top:1px;border:1px solid var(--line);background:#0c0c0b;display:none
}
.viewer.open{display:grid;grid-template-columns:minmax(240px,.7fr) 1.3fr}
.viewer-side{padding:34px;border-right:1px solid var(--line)}
.viewer-side .jp{font-size:64px;line-height:1;margin-bottom:38px;color:#b9b1a1}
.viewer-side h3{font-size:34px;font-weight:400;margin:0 0 6px}
.viewer-side small{color:#6f6a61;letter-spacing:.12em;text-transform:uppercase}
.viewer-main{padding:34px 38px 42px}
.viewer-main .lead{font-size:21px;line-height:1.65;color:#c8c2b7;margin-top:0}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);margin:28px 0}
.meta div{background:#11110f;padding:16px}
.meta span{display:block;color:#625e57;font:10px ui-monospace,SFMono-Regular,monospace;text-transform:uppercase;letter-spacing:.12em;margin-bottom:7px}
.meta strong{font-weight:400;font-size:14px}
.ideas{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:26px}
.idea{border-top:1px solid #37342f;padding-top:14px}
.idea b{display:block;font-weight:400;margin-bottom:5px;color:#d7d0c4}
.idea p{margin:0;color:#817c73;line-height:1.55;font-size:14px}
.principles{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 32px}
.chip{
  background:transparent;border:1px solid #34322e;color:#9e998f;padding:10px 14px;border-radius:999px;cursor:pointer;
  transition:.2s
}
.chip:hover,.chip.active{border-color:#aaa18f;color:#ddd5c7;background:#151410}
.connections{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.connection{background:#0e0e0d;padding:24px;min-height:160px}
.connection .source{font:10px ui-monospace,SFMono-Regular,monospace;color:#6d685f;letter-spacing:.14em;text-transform:uppercase}
.connection h3{font-size:20px;font-weight:400;margin:12px 0 8px}
.connection p{margin:0;color:#858077;line-height:1.58;font-size:14px}
.note{
  padding:28px;border:1px solid #2f2d29;background:#0d0d0c;color:#8c877e;line-height:1.7
}
.note strong{color:#cfc7b8;font-weight:400}
footer{padding:52px 0 70px;color:#5f5b55;font-size:12px;text-align:center;letter-spacing:.08em}
.close{
  float:right;border:1px solid #35322e;background:transparent;color:#aaa39a;padding:7px 10px;cursor:pointer
}
@media(max-width:820px){
  .hero{min-height:66svh}
  .hero:before{background:radial-gradient(circle at 50% 14%,rgba(169,151,111,.10) 0%,transparent 38%),linear-gradient(180deg,#11110f 0%,#080808 55%,#060606 100%)}
  .hero:after{background:linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px);background-size:28px 28px;opacity:.2}
  .hero .wrap{padding:56px 0 84px}
  .hero-copy{max-width:100%;padding-left:16px}
  .hero-credit{left:16px;right:auto;bottom:18px;text-align:left;max-width:80%;line-height:1.4}
  .gates{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gate{min-height:330px;padding:16px 12px 14px}
  .book{width:min(72%,140px);margin:4px auto 8px}
  .gate .num{font-size:8px;margin-bottom:6px}
  .gate-caption{padding-top:8px}
  .gate-caption .original{font-size:8px;margin-bottom:5px}
  .gate h3{font-size:18px;margin-bottom:5px}
  .gate p{font-size:10.5px;line-height:1.35}
  .gate:after{font-size:8px;margin-top:8px}
  .viewer.open{grid-template-columns:1fr}
  .viewer-side{border-right:0;border-bottom:1px solid var(--line)}
  .meta{grid-template-columns:1fr}
  .ideas,.connections{grid-template-columns:1fr}
  .section-head{display:block}
  .section-intro{margin-top:15px}
}

.bridge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.bridge-card{background:#0e0e0d;padding:26px;min-height:270px;display:flex;flex-direction:column}
.bridge-card .eyebrow{font:10px ui-monospace,SFMono-Regular,monospace;letter-spacing:.14em;text-transform:uppercase;color:#6f6a61}
.bridge-card h3{font-size:25px;font-weight:400;margin:14px 0 10px}
.bridge-card p{color:#858077;line-height:1.62;font-size:14px;margin:0 0 18px}
.bridge-card a{margin-top:auto;text-decoration:none;border-top:1px solid #34312d;padding-top:14px;color:#c8c0b2;font-size:13px}
.bridge-card a:hover{color:white}
.film-line{display:grid;grid-template-columns:1fr 60px 1fr;align-items:center;gap:16px;margin:30px 0}
.film-box{border:1px solid var(--line);padding:24px;background:#0e0e0d}
.film-box h3{font-weight:400;margin:0 0 8px;font-size:24px}
.film-box p{margin:0;color:#888279;line-height:1.6;font-size:14px}
.arrow{font-size:30px;text-align:center;color:#6f685d}
.visual-archive{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:28px}
.visual-card{min-height:220px;border:1px solid var(--line);padding:24px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;background:#0d0d0c}
.visual-card:before{content:"";position:absolute;inset:0;opacity:.18;background:linear-gradient(135deg,transparent 0 25%,#7a1820 25% 38%,transparent 38% 54%,#b78b2f 54% 65%,transparent 65%),linear-gradient(25deg,#23354b,transparent 50%)}
.visual-card:nth-child(2):before{background:linear-gradient(160deg,#b22b24 0 18%,transparent 18% 50%,#d6a832 50% 62%,transparent 62%),linear-gradient(30deg,#253b2e,transparent 60%);opacity:.22}
.visual-card:nth-child(3):before{background:radial-gradient(circle at 30% 30%,#e0b735 0 8%,transparent 9%),linear-gradient(140deg,#2f5d3b,transparent 45%),linear-gradient(25deg,#456da0,transparent 60%);opacity:.28}
.visual-card:nth-child(4):before{background:linear-gradient(120deg,#762f2b 0 20%,transparent 20% 43%,#334761 43% 58%,transparent 58%),linear-gradient(20deg,#7f6938,transparent 65%);opacity:.22}
.visual-card>*{position:relative}
.visual-card h3{margin:0 0 8px;font-size:25px;font-weight:400}
.visual-card p{margin:0;color:#8c867d;line-height:1.55;font-size:14px}
.visual-card a{margin-top:22px;display:inline-block;text-decoration:none;color:#d0c8b9;border-bottom:1px solid #655f55;padding-bottom:4px}
.rights{margin-top:18px;color:#68635c;font-size:12px;line-height:1.55}
@media(max-width:820px){
  .bridge-grid,.visual-archive{grid-template-columns:1fr}
  .film-line{grid-template-columns:1fr}
  .arrow{transform:rotate(90deg)}
}

/* --- capas históricas y conexiones --- */
.timeline-wrap{overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
.timeline{
  min-width:920px;display:grid;grid-template-columns:repeat(6,1fr);gap:0;
  position:relative;padding:32px 0 8px
}
.timeline:before{content:"";position:absolute;left:4%;right:4%;top:45px;height:1px;background:#4b4740}
.time-item{position:relative;padding:42px 18px 16px}
.time-item:before{
  content:"";position:absolute;top:38px;left:18px;width:13px;height:13px;border-radius:50%;
  background:#0b0b0a;border:1px solid #a79b86;box-shadow:0 0 0 5px rgba(167,155,134,.04)
}
.time-item .date{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;color:#9b9386;letter-spacing:.1em;text-transform:uppercase}
.time-item h3{font-size:18px;font-weight:400;margin:9px 0 6px}
.time-item p{margin:0;color:#777168;font-size:12px;line-height:1.5}
.map-shell{border:1px solid var(--line);background:#0b0b0a;padding:28px;overflow:hidden}
.map-legend{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:22px;color:#756f66;font:10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase}
.map-legend span:before{content:"";display:inline-block;width:22px;height:1px;background:#8e826e;vertical-align:middle;margin-right:8px}
.map-legend .echo:before{background:#4d4942}
.thought-map{display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(5,72px);gap:10px;position:relative}
.map-node{
  border:1px solid #35322e;background:#10100f;padding:14px;display:flex;align-items:center;justify-content:center;
  text-align:center;position:relative;z-index:2;font-size:15px
}
.map-node small{display:block;color:#6d675f;font:9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.n-tao{grid-column:1/4;grid-row:1}.n-sunzi{grid-column:5/8;grid-row:1}.n-bushido{grid-column:9/13;grid-row:1}
.n-hagakure{grid-column:9/13;grid-row:3}.n-shoninki{grid-column:5/8;grid-row:4}.n-bansen{grid-column:1/4;grid-row:4}
.flow{
  position:absolute;height:1px;background:#8e826e;transform-origin:left center;z-index:1;opacity:.72
}
.flow.echo{background:#4d4942;opacity:.7}
.f1{left:27%;top:47px;width:18%}
.f2{left:23%;top:271px;width:22%}
.f3{left:59%;top:47px;width:18%}
.f4{left:69%;top:155px;width:17%;transform:rotate(90deg)}
.f5{left:25%;top:270px;width:18%}
.map-note{margin-top:20px;color:#746f67;font-size:12px;line-height:1.6}
.archive{
  margin-top:28px;border:1px solid #302e2a;background:#0d0d0c
}
.archive summary{
  list-style:none;cursor:pointer;padding:16px 18px;color:#aaa296;
  font:10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase
}
.archive summary::-webkit-details-marker{display:none}
.archive summary:after{content:"＋";float:right;color:#655f56}
.archive[open] summary:after{content:"—"}
.archive-body{border-top:1px solid #302e2a;padding:18px}
.archive-body h4{font-size:22px;font-weight:400;margin:0 0 8px;color:#d1c9bb}
.archive-body p{margin:0;color:#837d74;font-size:14px;line-height:1.65}

/* --- entrada aleatoria --- */
body.intro-active{overflow:hidden}
body.intro-active #siteContent,
body.intro-active footer{display:none}
.entry-hero{
  min-height:100svh!important;
  display:block!important;
  position:relative;
  background:
    radial-gradient(circle at 50% 42%,rgba(169,151,111,.075),transparent 34%),
    linear-gradient(180deg,#0d0d0c 0%,#070707 62%,#050505 100%)!important;
  transition:opacity .55s ease,transform .55s ease,filter .55s ease
}
.entry-hero.leaving{opacity:0;transform:scale(.985);filter:blur(3px)}
.entry-hero:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(rgba(255,255,255,.014) 1px,transparent 1px);
  background-size:38px 38px;opacity:.22
}
.entry-wrap{
  min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;
  align-items:center;padding:30px 0 26px;position:relative;z-index:1
}
.entry-mark{
  text-align:center;
  font:10px ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.34em;color:#777168;text-transform:uppercase
}
.entry-center{
  width:min(100%,860px);margin:auto;text-align:center;padding:30px 0 46px
}
.entry-glyph{
  font-size:clamp(50px,8vw,86px);line-height:1;margin-bottom:32px;
  color:#b7ae9e;opacity:.78;font-family:serif
}
.entry-quote{
  margin:0 auto;
  max-width:800px;
  font-size:clamp(29px,5.4vw,67px);
  line-height:1.18;
  font-weight:400;
  letter-spacing:.005em;
  color:#ded7ca
}
.entry-source{
  margin-top:28px;
  color:#69635b;
  font:10px ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.18em;text-transform:uppercase
}
.enter-button{
  margin-top:46px;
  min-width:150px;
  background:transparent;
  border:1px solid #4b463e;
  color:#c8c0b2;
  padding:13px 24px 12px;
  cursor:pointer;
  font:10px ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.25em;
  transition:.25s ease
}
.enter-button:hover,.enter-button:focus-visible{
  outline:none;border-color:#a79b86;color:#fff;background:#11100e;
  transform:translateY(-2px)
}
.entry-foot{
  text-align:center;
  color:#4e4943;
  font:9px ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.18em;text-transform:uppercase
}
@media(max-width:820px){
  .entry-wrap{padding:24px 0 20px}
  .entry-center{padding:24px 8px 38px}
  .entry-glyph{margin-bottom:24px}
  .entry-quote{font-size:clamp(27px,9vw,46px);line-height:1.18}
  .entry-source{margin-top:22px}
  .enter-button{margin-top:38px}
}


/* --- información integrada dentro de cada camino --- */
.compact-paths{padding-top:34px;padding-bottom:54px;min-height:100svh}
.viewer-main{display:block}
.path-block{margin-top:34px;padding-top:22px;border-top:1px solid #302d29}
.path-block-label{
  font:10px ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.16em;text-transform:uppercase;color:#6e685f;margin-bottom:13px
}
.path-block h4{font-size:24px;font-weight:400;margin:0 0 12px;color:#d5cdbf}
.path-block p{margin:0;color:#89837a;line-height:1.7;font-size:14px}
.path-list{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.path-item{border:1px solid #302d29;background:#10100f;padding:16px}

.path-principle span{display:block;color:#7a746b;font-size:12px;line-height:1.5}
.viewer-side{position:sticky;top:0;align-self:start}
@media(max-width:820px){
  .compact-paths{padding-top:18px}

const gates=document.getElementById("gates");
const viewer=document.getElementById("viewer");
function coverMarkup(w){
 const common=`cover-${w.id}`;
 if(w.id==="tao") return `<div class="book ${common}"><span class="slip vertical">${w.jp}</span><span class="mini">老子</span><i class="binding"></i></div>`;
 if(w.id==="sunzi") return `<div class="book ${common}"><span class="pattern"></span><span class="slip vertical">${w.jp}</span><span class="seal">兵</span><i class="binding"></i></div>`;
 if(w.id==="hagakure") return `<div class="book ${common}"><span class="slip vertical">${w.jp}</span><span class="vol">聞書</span><i class="binding"></i></div>`;
 if(w.id==="bushido") return `<div class="book ${common}"><span class="gold-rule"></span><span class="branch"></span><span class="latin-title">BUSHIDO</span><span class="latin-sub">THE SOUL OF JAPAN</span><span class="red-sun"></span></div>`;
 if(w.id==="shoninki") return `<div class="book ${common}"><span class="brush">${w.jp}</span><span class="small-kanji">天</span><i class="binding"></i></div>`;
 return `<div class="book ${common}"><span class="brush">${w.jp}</span><span class="cord c1"></span><span class="cord c2"></span><span class="knot"></span></div>`;
}
works.forEach(w=>{
 const b=document.createElement("button");
 b.className="gate";
 b.innerHTML=`<span class="num">CAMINO ${w.num}</span>${coverMarkup(w)}<div class="gate-caption"><span class="original">${w.title}</span><h3>${w.coverTitle}</h3><p>${w.coverDesc}</p></div>`;
 b.onclick=()=>openWork(w);
 gates.appendChild(b);
});
function openWork(w){
 viewer.className="viewer open";
 const principles=Object.entries(principleData)
   .map(([name,items])=>({name,item:items.find(x=>x[0]===w.title)}))
   .filter(x=>x.item);
 const extra=workExtras[w.id];
 const related=relatedArchives[w.id];

 viewer.innerHTML=`
 <aside class="viewer-side">
   <button class="close" aria-label="Cerrar">×</button>
   <div class="jp">${w.jp}</div>
   <h3>${w.coverTitle}</h3>
   <small>${w.title} · ${w.subtitle}</small>
 </aside>
 <article class="viewer-main">
   <p class="lead">${w.lead}</p>

   <div class="meta">
     <div><span>Contexto</span><strong>${w.era}</strong></div>
     <div><span>Núcleo</span><strong>${w.focus}</strong></div>
     <div><span>Forma</span><strong>${w.form}</strong></div>
   </div>

   <section class="path-block">
     <div class="path-block-label">Contexto histórico</div>
     <p>${extra.history}</p>
   </section>

   <section class="path-block">
     <div class="path-block-label">Principios</div>
     <div class="ideas">${w.ideas.map(i=>`<div class="idea"><b>${i[0]}</b><p>${i[1]}</p></div>`).join("")}</div>
   </section>

   <section class="path-block">
     <div class="path-block-label">Ecos dentro de los seis caminos</div>
     <div class="path-principles">${principles.map(x=>`<div class="path-principle"><strong>${x.name}</strong><span>${x.item[1]}</span></div>`).join("")}</div>
   </section>

   <section class="path-block">
     <div class="path-block-label">Conexiones</div>
     <div class="path-list">${extra.connections.map(c=>`<div class="path-item"><b>${c[0]}</b><p>${c[1]}</p></div>`).join("")}</div>
   </section>

   <section class="path-block">
     <div class="path-block-label">Manuscrito relacionado</div>
     <h4>${related.title}</h4>
     <p>${related.text}</p>
   </section>
 </article>`;
 viewer.querySelector(".close").onclick=()=>viewer.className="viewer";
 viewer.scrollIntoView({behavior:"smooth",block:"start"});

(function initEntrance(){
  const quote=document.getElementById("entryQuote");
  const source=document.getElementById("entrySource");
  const glyph=document.getElementById("entryGlyph");
  const enter=document.getElementById("enterButton");
  const hero=document.getElementById("entryHero");
  if(!quote||!source||!glyph||!enter||!hero) return;

  let last=-1;
  try{last=parseInt(localStorage.getItem("seisCaminosLastPhrase"),10)}catch(e){}
  let idx=Math.floor(Math.random()*entryPhrases.length);
  if(entryPhrases.length>1 && idx===last) idx=(idx+1+Math.floor(Math.random()*(entryPhrases.length-1)))%entryPhrases.length;
  const p=entryPhrases[idx];
  quote.textContent=p.q;
  source.textContent="ECO DE "+p.s.toUpperCase();
  glyph.textContent=p.g;
  try{localStorage.setItem("seisCaminosLastPhrase",String(idx))}catch(e){}

  enter.addEventListener("click",()=>{
    hero.classList.add("leaving");
    setTimeout(()=>{
      document.body.classList.remove("intro-active");
      hero.hidden=true;
      window.scrollTo({top:0,behavior:"auto"});
      const first=document.getElementById("caminos");
      if(first) first.scrollIntoView({behavior:"auto",block:"start"});
    },520);
  });
})();
